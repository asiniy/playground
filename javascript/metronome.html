<!-- https://raw.githack.com/asiniy/playground/master/javascript/metronome.html -->
<html>
  <head>
    <title>Metronome</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom/": "https://esm.sh/react-dom@19.0.0/"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client"
      import htm from "https://unpkg.com/htm@latest?module";
      const html = htm.bind(React.createElement);

      const beep = new Audio('https://www.soundjay.com/buttons/beep-07a.wav')

      const Timer = ({ period }) => {
        const periodMs = period * 1000
        const [startedAt, _] = React.useState(+new Date())
        const [timeLeft, setTimeLeft] = React.useState(0)

        React.useEffect(() => {
          const timerInterval = setInterval(() => {
            const newTimeLeft = (periodMs - (+new Date() - startedAt) % periodMs) / 1000
            if (newTimeLeft > timeLeft) {
              beep.play()
            }
            setTimeLeft(newTimeLeft)
          }, 1000 / 24) // TV FPS
          return () => clearInterval(timerInterval)
        })

        return html`<h1 style=${{ fontSize: "200px" }}>${timeLeft.toFixed(1)}</h1>`
      }

      const Input = ({ setPeriod }) => {
        const [value, setValue] = React.useState(5.0)
        const onChange = (e) => {
          setValue(e.target.value)
        }
        const onClick = () => {
          setPeriod(Number(value))
        }

        return html`<input type="number" value=${value} onChange=${onChange} min="0" step="0.05" /><br /><button onClick=${onClick}>Start</button>`
      }

      const App = () => {
        const [period, setPeriod] = React.useState(null)

        return period ?
          html`<${Timer} period=${period} />` :
          html`<${Input} setPeriod=${setPeriod} />`
      }

      const root = createRoot(document.getElementById('root'))
      root.render(html`<${App} />`)
    </script>
  </body>
</html>
